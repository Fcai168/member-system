<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>后台管理 - 易捷加油</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F7FA;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Header */
    .admin-header {
      background: linear-gradient(135deg, #E53935 0%, #C62828 100%);
      padding: 12px 16px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(229, 57, 53, 0.3);
    }
    
    .admin-title {
      font-size: 17px;
      font-weight: 700;
    }
    
    .admin-logout {
      font-size: 13px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      cursor: pointer;
      border: none;
      color: white;
      transition: background 0.2s;
    }
    
    .admin-logout:hover { background: rgba(255,255,255,0.3); }
    
    /* Main content */
    .admin-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px;
      gap: 12px;
    }
    
    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      flex-shrink: 0;
    }
    
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #E53935;
      margin-bottom: 2px;
    }
    
    .stat-label {
      font-size: 11px;
      color: #999;
    }
    
    /* Menu grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      flex-shrink: 0;
    }
    
    .menu-btn {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    
    .menu-btn:active {
      transform: scale(0.95);
    }
    
    .menu-icon {
      font-size: 24px;
    }
    
    .menu-text {
      font-size: 12px;
      color: #333;
      font-weight: 600;
    }
    
    /* Panel */
    .panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      align-items: flex-end;
    }
    
    .panel-overlay.active {
      display: flex;
    }
    
    .panel {
      background: white;
      width: 100%;
      max-height: 80vh;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .panel-title {
      font-size: 17px;
      font-weight: 700;
    }
    
    .panel-close {
      font-size: 24px;
      color: #999;
      cursor: pointer;
      padding: 4px;
    }
    
    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    
    .data-table th {
      background: #F5F5F5;
      padding: 10px 6px;
      text-align: left;
      font-weight: 600;
      color: #666;
    }
    
    .data-table td {
      padding: 10px 6px;
      border-bottom: 1px solid #F0F0F0;
    }
    
    .data-table tr:last-child td {
      border-bottom: none;
    }
    
    /* Tags */
    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .tag-processing { background: #FFF3E0; color: #F57C00; }
    .tag-completed { background: #E8F5E9; color: #4CAF50; }
    .tag-failed { background: #FFEBEE; color: #E53935; }
    
    /* Buttons */
    .view-proof-btn {
      background: #E53935;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    /* Search */
    .search-bar {
      margin-bottom: 12px;
    }
    
    .search-bar input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      font-size: 14px;
    }
    
    /* Footer */
    .admin-footer {
      text-align: center;
      padding: 10px;
      font-size: 10px;
      color: #999;
      flex-shrink: 0;
    }
    
    .admin-footer a {
      color: #666;
      text-decoration: none;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 2000;
      display: none;
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .loading::after {
      content: '...';
      animation: dots 1.5s infinite;
    }
    
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="admin-header">
    <div class="admin-title">后台管理</div>
    <button class="admin-logout" onclick="handleLogout()">退出</button>
  </div>
  
  <!-- Main content -->
  <div class="admin-body">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="statOrders">-</div>
        <div class="stat-label">总订单</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statSales">-</div>
        <div class="stat-label">总销售额</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statUsers">-</div>
        <div class="stat-label">用户数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statRate">-</div>
        <div class="stat-label">完成率</div>
      </div>
    </div>
    
    <!-- Menu -->
    <div class="menu-grid">
      <button class="menu-btn" onclick="showOrders()">
        <span class="menu-icon">📋</span>
        <span class="menu-text">订单管理</span>
      </button>
      <button class="menu-btn" onclick="showCoupons()">
        <span class="menu-icon">🎫</span>
        <span class="menu-text">优惠券</span>
      </button>
      <button class="menu-btn" onclick="showSettings()">
        <span class="menu-icon">⚙️</span>
        <span class="menu-text">系统设置</span>
      </button>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="admin-footer">
    <p><a href="http://www.sinopecgroup.com" target="_blank">京ICP备2020037595号-1</a></p>
    <p>主办单位：中石化易捷销售有限公司 | 地址：北京市朝阳区朝阳门北大街22号</p>
  </div>
  
  <!-- Order Panel -->
  <div class="panel-overlay" id="orderOverlay" onclick="closePanel(event, 'orderOverlay')">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title" id="panelTitle">📋 订单管理</span>
        <span class="panel-close" onclick="closePanel()">&times;</span>
      </div>
      <div id="panelBody">
        <div class="loading">加载中</div>
      </div>
    </div>
  </div>
  
  <!-- Proof Overlay -->
  <div class="panel-overlay" id="proofOverlay" onclick="closeProof(event)">
    <div class="panel" style="max-height: 60vh;">
      <div class="panel-header">
        <span class="panel-title">支付凭证</span>
        <span class="panel-close" onclick="closeProof()">&times;</span>
      </div>
      <img id="proofImage" src="" style="width: 100%; border-radius: 8px;">
    </div>
  </div>
  
  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Supabase config
    const SUPABASE_URL = 'https://gntjfuzhltkhnbbukjomx.supabase.co';
    const SUPABASE_KEY = 'sbp_aed597bb8cfe035b256879db1c65f7da9213ed84';
    
    // Check login
    if (sessionStorage.getItem('isAdmin') !== 'true') {
      window.location.href = 'admin-login.html';
    }
    
    let supabase;
    let ordersData = [];
    let couponsData = [];
    
    // Initialize
    async function init() {
      try {
        // Initialize Supabase client
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Load orders
        await loadOrders();
        
        // Load coupons
        await loadCoupons();
        
        // Update stats
        updateStats();
      } catch (error) {
        console.error('Init error:', error);
        showToast('加载失败，请刷新重试', 'error');
      }
    }
    
    // Load orders from Supabase
    async function loadOrders() {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });
      
      if (error) {
        console.error('Load orders error:', error);
        return;
      }
      
      ordersData = data || [];
    }
    
    // Load coupons from Supabase
    async function loadCoupons() {
      const { data, error } = await supabase
        .from('vouchers')
        .select('*')
        .order('created_at', { ascending: false });
      
      if (error) {
        console.error('Load coupons error:', error);
        return;
      }
      
      couponsData = data || [];
    }
    
    // Update stats
    function updateStats() {
      document.getElementById('statOrders').textContent = ordersData.length;
      
      const totalSales = ordersData.reduce((sum, o) => sum + parseFloat(o.pay_amount || 0), 0);
      document.getElementById('statSales').textContent = '¥' + totalSales.toFixed(0);
      
      const uniqueUsers = new Set(ordersData.map(o => o.phone)).size;
      document.getElementById('statUsers').textContent = uniqueUsers;
      
      const completed = ordersData.filter(o => o.status === 'completed').length;
      const rate = ordersData.length > 0 ? Math.round((completed / ordersData.length) * 100) : 0;
      document.getElementById('statRate').textContent = rate + '%';
    }
    
    // Show orders
    async function showOrders() {
      await loadOrders();
      
      document.getElementById('panelTitle').textContent = '📋 订单管理 (' + ordersData.length + ')';
      const body = document.getElementById('panelBody');
      
      if (ordersData.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无订单数据</div></div>';
      } else {
        body.innerHTML = `
          <table class="data-table">
            <thead>
              <tr>
                <th>订单号</th>
                <th>手机号</th>
                <th>金额</th>
                <th>凭证</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody>
              ${ordersData.map(o => `
                <tr>
                  <td style="font-size:11px;">${o.order_no}</td>
                  <td>${maskPhone(o.phone)}</td>
                  <td>¥${o.pay_amount}</td>
                  <td>
                    ${o.screenshot ? 
                      `<button class="view-proof-btn" onclick="viewProof('${o.screenshot}')">查看</button>` : 
                      '<span style="color:#ccc;">-</span>'}
                  </td>
                  <td><span class="tag tag-${o.status}">${getStatusText(o.status)}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }
      
      document.getElementById('orderOverlay').classList.add('active');
    }
    
    // View proof
    function viewProof(src) {
      const img = document.getElementById('proofImage');
      img.src = src;
      document.getElementById('proofOverlay').classList.add('active');
    }
    
    // Show coupons
    async function showCoupons() {
      await loadCoupons();
      
      document.getElementById('panelTitle').textContent = '🎫 优惠券管理 (' + couponsData.length + ')';
      const body = document.getElementById('panelBody');
      
      if (couponsData.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="icon">🎫</div><div>暂无优惠券</div></div>';
      } else {
        body.innerHTML = `
          <table class="data-table">
            <thead>
              <tr>
                <th>券码</th>
                <th>手机号</th>
                <th>金额</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody>
              ${couponsData.map(v => `
                <tr>
                  <td style="font-size:11px;">${v.voucher_code}</td>
                  <td>${maskPhone(v.phone)}</td>
                  <td>¥${v.amount}</td>
                  <td><span class="tag tag-${v.status === 'active' ? 'completed' : 'failed'}">${v.status === 'active' ? '有效' : '已用'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }
      
      document.getElementById('orderOverlay').classList.add('active');
    }
    
    // Show settings
    async function showSettings() {
      document.getElementById('panelTitle').textContent = '⚙️ 系统设置';
      const body = document.getElementById('panelBody');
      
      body.innerHTML = `
        <div style="padding: 20px 0;">
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">管理员密码</label>
            <input type="password" id="adminPassword" value="admin123" style="width: 100%; padding: 10px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 14px;">
          </div>
          <button onclick="saveSettings()" style="width: 100%; padding: 12px; background: #E53935; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">保存设置</button>
        </div>
      `;
      
      document.getElementById('orderOverlay').classList.add('active');
    }
    
    // Save settings
    async function saveSettings() {
      const newPassword = document.getElementById('adminPassword').value;
      
      const { error } = await supabase
        .from('settings')
        .update({ admin_password: newPassword })
        .eq('id', 1);
      
      if (error) {
        showToast('保存失败', 'error');
        console.error('Save settings error:', error);
        return;
      }
      
      showToast('设置已保存', 'success');
      closePanel();
    }
    
    // Close panel
    function closePanel(event, overlayId) {
      if (event && event.target !== document.getElementById(overlayId)) return;
      document.getElementById(overlayId).classList.remove('active');
    }
    
    // Close proof
    function closeProof(event) {
      if (event && event.target !== document.getElementById('proofOverlay')) return;
      document.getElementById('proofOverlay').classList.remove('active');
    }
    
    // Logout
    function handleLogout() {
      if (confirm('确定要退出登录吗？')) {
        sessionStorage.removeItem('isAdmin');
        window.location.href = 'admin-login.html';
      }
    }
    
    // Helper: mask phone
    function maskPhone(phone) {
      if (!phone || phone.length !== 11) return phone || '';
      return phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
    }
    
    // Helper: get status text
    function getStatusText(status) {
      const map = { processing: '处理中', completed: '已完成', failed: '失败' };
      return map[status] || status;
    }
    
    // Toast
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      if (type === 'error') toast.style.background = 'rgba(229, 57, 53, 0.9)';
      else if (type === 'success') toast.style.background = 'rgba(76, 175, 80, 0.9)';
      else toast.style.background = 'rgba(0,0,0,0.85)';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
    
    // Initialize on load
    init();
  </script>
</body>
</html>
